name: Build SARemix Installer

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Verify 7zip folder
      run: |
        if (-not (Test-Path "7zip")) {
            Write-Error "7zip folder not found in repository"
            exit 1
        }

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onefile --windowed --add-data "7zip;7zip/" --icon=NONE SARemix_Installer.py

    - name: Create Release Package
      run: |
        mkdir release_package
        Copy-Item "dist/SARemix_Installer.exe" -Destination "release_package/"
        Copy-Item "7zip" -Destination "release_package/7zip" -Recurse
        Compress-Archive -Path "release_package/*" -DestinationPath "SARemix_Installer.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: SARemix_Installer
        path: SARemix_Installer.zip

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: SARemix_Installer
        files: SARemix_Installer.zip
        generate_release_notes: true